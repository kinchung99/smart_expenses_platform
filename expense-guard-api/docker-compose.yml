# docker-compose.yml (expense-guard-api)
services:
  postgres:
    image: postgres:16-alpine
    container_name: expenseguard-db
    environment:
      POSTGRES_DB: expenseguard
      POSTGRES_USER: expenseguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: